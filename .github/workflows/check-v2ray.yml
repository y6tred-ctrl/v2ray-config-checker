name: V2Ray Config Checker

on:
  schedule:
    - cron: '0 * * * *'  # Каждый час
  workflow_dispatch:  # Вручной запуск

permissions:
  contents: write

jobs:
  check-configs:
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run checker
        run: python check_configs.py
        timeout-minutes: 10
      
      - name: Commit results
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add *.txt *.json *.md
          git diff --cached --quiet || git commit -m "🔄 $(date -u)"
          git push || echo "Push failed"
        continue-on-error: true
